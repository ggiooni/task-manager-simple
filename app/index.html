<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Inventory Manager</h1>

        <form id="itemForm">
            <input type="text" id="itemName" placeholder="Item name" required>
            <input type="number" id="itemQty" placeholder="Quantity" min="0" required>
            <input type="number" id="itemPrice" placeholder="Price" min="0" step="0.01" required>
            <button type="submit" id="addBtn">Add Item</button>
        </form>

        <input type="text" id="searchInput" placeholder="Search items...">

        <table id="inventoryTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Total</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="inventoryBody"></tbody>
        </table>

        <div id="summary">
            <span id="totalItems">Items: 0</span>
            <span id="totalValue">Total Value: $0.00</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
